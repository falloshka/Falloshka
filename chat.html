  <!-- ✅ HERO -->
  <section class="hero">
    <div class="hero-content">
      <h1 data-i18n="chatHeroTitle">Open Topic Chat</h1>
      <p data-i18n="chatHeroText">
        Connect with others, share your thoughts, and explore the mysteries together.
      </p>
    </div>
  </section>


  <input id="nickname" placeholder="Nickname">
  <div id="chatBox"></div>

  <div class="input-area">
    <input id="messageInput" placeholder="Write something...">
    <button class="primary-btn" onclick="sendMessage()">Send</button>
  </div>

  <script>

    // ✅ SENİN CONFIG (KOPYALADIM)
    const firebaseConfig = {
      apiKey: "AIzaSyCYT3l0WyRdVjg7NTrfwMIoL7eh4cEWQHI",
      authDomain: "falloshka-chat.firebaseapp.com",
      databaseURL: "https://falloshka-chat-default-rtdb.firebaseio.com",
      projectId: "falloshka-chat"
    };

    // ✅ INIT
    firebase.initializeApp(firebaseConfig);

    const db = firebase.database();
    const chatRef = db.ref("chat");

    // ✅ SEND MESSAGE
    function sendMessage() {
      const name = document.getElementById("nickname").value.trim();
      const text = document.getElementById("messageInput").value.trim();

      if (!name || !text) return;

      chatRef.push({
        name: name,
        text: text,
        time: Date.now()
      });

      document.getElementById("messageInput").value = "";
    }

    // ✅ LISTEN MESSAGES
    chatRef.on("value", snapshot => {
      const data = snapshot.val();
      const chatBox = document.getElementById("chatBox");

      chatBox.innerHTML = "";

      const now = Date.now();
      const sixHours = 6 * 60 * 60 * 1000;

      Object.values(data || {}).forEach(msg => {

        // ✅ 6 SAATLIK MESAJ GÖSTER
        if (now - msg.time > sixHours) return;

        const div = document.createElement("div");
        div.className = "msg";

        div.innerHTML = `
      <div class="msg-name">${msg.name}</div>
      <div class="msg-text">${msg.text}</div>
    `;

        const currentUser = document.getElementById("nickname").value.trim();

        if (msg.name === currentUser) {
          div.classList.add("my-msg");
        } else {
          div.classList.add("other-msg");
        }

        chatBox.appendChild(div);
      });

      chatBox.scrollTop = chatBox.scrollHeight;
    });

  </script>
